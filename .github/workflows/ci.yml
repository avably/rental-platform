name: ci
on:
  pull_request:
  push: { branches: [main] }

# Koszt minut Actions (ADR-117). Jeden komplet ciężkich jobów to ~26 minut
# maszyn, a pakiet 2000 minut wyczerpał się w połowie miesiąca — wtedy GitHub
# przestaje TWORZYĆ przebiegi i nie da się nic zmergować. Bramek to nie
# osłabia: zmienia się KIEDY joby biegną, nie CO sprawdzają.
#
# 2026-08-11: CI przeniesione NA STAŁE na self-hosted runner `mac-pm`
# (macOS ARM64, Mac PM-a) — decyzja właściciela: limit wydatków Actions
# zostaje na zerze, a hosted runy stanęły na billing blocku (~18:41Z GitHub
# przestał wykonywać joby). Minuty self-hosted są DARMOWE; koszt przenosi
# się z portfela na obciążenie maszyny. Konsekwencje:
#   * jeden runner = joby biegną SZEREGOWO (wall-time przebiegu to SUMA
#     jobów, nie maksimum) — `concurrency.cancel-in-progress` dla PR-ów
#     jest przez to jeszcze ważniejsze niż na hosted;
#   * na tym samym Macu działa WSPÓŁDZIELONY deweloperski Supabase
#     (project_id "db", porty 543xx) — joby `rls`/`e2e` MUSZĄ izolować swój
#     efemeryczny stack (łatka + sonda: .github/scripts/supabase-ci-*.sh);
#   * `actions/cache` nie ma sensu (sieciowa wycieczka do magazynu GitHuba):
#     magazyn pnpm (~/Library/pnpm/store) i przeglądarki Playwrighta
#     (~/Library/Caches/ms-playwright) żyją na dysku runnera między
#     przebiegami; workspace runnera czyści `actions/checkout` (clean:true),
#     a kontenery/wolumeny CI sprząta krok `always()` po każdym jobie.
concurrency:
  # Grupa per workflow + ref. Dla `push` doklejamy SHA, więc każdy merge na
  # `main` ma WŁASNĄ grupę: przebiegi z main ani się nie ubijają, ani nie
  # czekają w kolejce jeden na drugiego (ślad o stanie `main` musi zostać po
  # KAŻDYM merge'u — to jedyny zapis, że ta wersja main przeszła bramki).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # Ubijanie w locie WYŁĄCZNIE dla PR-ów: kolejny push (typowo rebase przy
  # odbiorze) unieważnia poprzedni przebieg tej samej gałęzi.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zakres:
    # Tani job wstępny (ADR-117): ustala listę zmienionych plików i oddaje
    # werdykt KLASYFIKATOROWI `scripts/ci-zakres-zmian.mjs`. Warunków nie ma
    # w YAML-u celowo — logika bramki musi dać się przetestować lokalnie,
    # bez palenia minut, i jest przypięta suitą
    # `apps/panel/test/ci-zakres-zmian.test.ts`.
    #
    # DLACZEGO klasyfikator, a nie `paths:`/`paths-ignore:` na workflow:
    # filtr ścieżek na poziomie workflow w ogóle NIE TWORZY przebiegu, więc
    # wymagane checki wiszą jako „Expected" w nieskończoność i PR nie jest
    # mergowalny. Tu `zakres` biegnie ZAWSZE, a ciężkie joby dostają zawsze
    # KONKLUZJĘ: `success`/`failure` albo `skipped` — `skipped` spełnia
    # wymagane checki. Merge-gate PM: na PR docs-only zielony jest sam
    # `zakres`, pozostałe joby mają stan „skipped" (to wynik bramki, nie
    # awaria); „pending" nie występuje z konstrukcji.
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      pomin: ${{ steps.ocena.outputs.pomin }}
    steps:
      # Pełna historia: bez bazy nie ma z czym porównać, a „nie wiem" musi
      # znaczyć pełne CI, nie pominięcie.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Self-hosted: nie polegamy na Node z PATH maszyny (brew trzyma tam
      # Node 20) — klasyfikator ma biec na wersji przypiętej w repo (22).
      # Po pierwszym pobraniu binarka siedzi w tool-cache runnera (~2 s).
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: ocena
        env:
          ZDARZENIE: ${{ github.event_name }}
          BAZA_PR: ${{ github.event.pull_request.base.sha }}
          BAZA_PUSH: ${{ github.event.before }}
          WYMUSZONY_PUSH: ${{ github.event.forced }}
        run: |
          # ŚWIADOMIE bez `set -e`: każde potknięcie ma dać pełne CI, a nie
          # czerwony przebieg. Bramka kosztowa nie może blokować odbioru PR-a.
          set -uo pipefail
          pelne_ci() {
            echo "pomin=false" >> "$GITHUB_OUTPUT"
            echo "Pełne CI: $1"
            exit 0
          }
          case "$ZDARZENIE" in
            pull_request) BAZA="$BAZA_PR" ;;
            push)
              if [ "$WYMUSZONY_PUSH" = "true" ]; then
                pelne_ci "push wymuszony — poprzedni stan gałęzi nie do odtworzenia"
              fi
              BAZA="$BAZA_PUSH"
              ;;
            *) pelne_ci "zdarzenie $ZDARZENIE nie ma zdefiniowanej bazy" ;;
          esac
          case "$BAZA" in
            "" | 0000000000000000000000000000000000000000) pelne_ci "brak SHA bazy" ;;
          esac
          git cat-file -e "$BAZA^{commit}" 2>/dev/null || pelne_ci "SHA bazy $BAZA niedostępny w klonie"
          ZMIANY="$RUNNER_TEMP/zakres-zmian.txt"
          git diff --name-only --no-renames -z "$BAZA...HEAD" >"$ZMIANY" || pelne_ci "git diff nie policzył zakresu"
          node scripts/ci-zakres-zmian.mjs --zero <"$ZMIANY" || pelne_ci "klasyfikator nie oddał werdyktu"

  ci:
    # Pominięcie dla zmian wyłącznie dokumentacyjnych (ADR-117). `!cancelled()`
    # zamiast domyślnego warunku: gdy job `zakres` PADNIE, wyjście jest puste,
    # więc `!= 'true'` przepuszcza pełne CI — awaria klasyfikatora kosztuje
    # minuty, nigdy bramkę.
    needs: zakres
    if: ${{ !cancelled() && needs.zakres.outputs.pomin != 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.10
      # Bez `cache: pnpm` (self-hosted): cache akcji to sieciowa wycieczka do
      # magazynu GitHuba, a magazyn pnpm (~/Library/pnpm/store) leży na dysku
      # runnera i przeżywa między przebiegami — instalacja idzie twardymi
      # dowiązaniami z lokalnego store (checkout czyści node_modules, store
      # zostaje). Wzrost store jest ograniczony treścią (content-addressable);
      # higiena ręczna: `pnpm store prune` przy okazji porządków na maszynie.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Ten job nie ma lokalnego Supabase — testy integracyjne pokrywa
      # równoległy job `rls`. Pominięcie musi być jawne: bez tej flagi
      # strażnik (test/helpers/integration-env.ts) zamienia ciche pominięcie
      # w czerwony wynik. Job `rls` biegnie BEZ flagi — tam zniknięcie
      # zmiennych ma być błędem, nie pominięciem.
      # Self-hosted: środowisko runnera NIE ma zmiennych SUPABASE_LOCAL_*
      # (zweryfikowane na mac-pm) — testy integracyjne w tym jobie się
      # pomijają i NIE dotykają współdzielonego deweloperskiego Supabase.
      - run: pnpm test
        env: { ALLOW_INTEGRATION_SKIP: "1" }
      # Smoke-test nagłówków bezpieczeństwa (Zadanie 7): CSP z nonce (bez
      # 'unsafe-inline' w script-src) i HSTS na odpowiedzi middleware'u obu
      # aplikacji. Krok jest zawarty w `pnpm test` powyżej — wywołany jeszcze
      # raz jawnie, żeby regresja nagłówków była widoczna w logu CI pod własną
      # nazwą, a nie utonęła w zbiorczym wyniku.
      - name: Smoke-test nagłówków (CSP/HSTS)
        run: pnpm --filter @avably/security --filter storefront test
        env: { ALLOW_INTEGRATION_SKIP: "1" }
      - run: pnpm audit --audit-level high
      - run: bash scripts/audit-public-env.sh
      # Klient service-role omija RLS. Reguła ESLinta pilnuje IMPORTU
      # `@avably/db/service`, ta bramka pilnuje NAZWY SEKRETU — czyli drugiej
      # drogi do tej samej władzy (dwie linijki z `createClient` i
      # `SUPABASE_SERVICE_ROLE_KEY` przechodzą lint na zielono). Skanuje całe
      # drzewo, więc obejmuje też aplikacje, które nie mają jeszcze własnej
      # konfiguracji ESLinta (ADR-067).
      - name: Bramka service-role (wyłącznie webhooki i joby)
        run: bash scripts/audit-service-role.sh
      # Wartości env są tu MARKERAMI do grepa po zbudowanym bundlu (bramka
      # szuka wmurowanej WARTOŚCI) — nic się z nimi nie łączy, więc adres
      # 127.0.0.1:54321 nie dotyka współdzielonego Supabase na mac-pm.
      - name: Bramka wmurowania NEXT_PUBLIC_* w bundlu klienckim panelu
        run: bash scripts/audit-browser-env-inlining.sh
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"

  wp-plugin:
    # Suita PHP wtyczki WordPress (kontrakt źródła R10, bramki amplifikacji
    # R11) + kontrola zgodności wygenerowanej paczki z repo. Bez tego jobu
    # 120+ testów wtyczki odpalało się WYŁĄCZNIE ręcznie
    # (dev/run-tests.sh) — trzy pozostałe joby nie mówią o nich nic, więc
    # bramka degradowała się przy pierwszym refaktorze (recenzja PM #216).
    #
    # Od 2026-08-11 (self-hosted) job przechodzi przez bramkę `zakres`, jak
    # pozostałe. To NIE jest odrzucone w #216 warunkowanie po wzorcach
    # ścieżek: klasyfikator to fail-closed BIAŁA LISTA dokumentacji (każda
    # nieznana ścieżka = pełny przebieg), a zmiana docs-only nie może dotknąć
    # źródeł wtyczki. Na własnym sprzęcie oszczędzamy nie minuty, a obciążenie
    # Maca PM-a. Merge-gate: na PR docs-only job ma stan `skipped` (patrz
    # komentarz przy jobie `zakres`).
    needs: zakres
    if: ${{ !cancelled() && needs.zakres.outputs.pomin != 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      # macOS bez PHP na hoście: testy biegną w kontenerze php:8.1-cli przez
      # TEN SAM skrypt co lokalny dev (dev/run-tests.sh) — dolna granica
      # zgodności wtyczki (PHP 8.1), zero mutowania maszyny runnera.
      # PHPUnit (phar, ~7 MB) skrypt pobiera do dev/.cache w workspace —
      # checkout czyści workspace, więc pobranie powtarza się per przebieg;
      # świadomie akceptowane (mały plik, deterministyczna wersja).
      - name: Testy jednostkowe wtyczki (kontener php:8.1-cli)
        run: sh integrations/wordpress/avably-booking/dev/run-tests.sh
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Paczka w repo MUSI odpowiadać źródłom wtyczki bajt w bajt — inaczej
      # operator pobiera z panelu starą wersję. Skrypt używa wyłącznie
      # modułów wbudowanych Node, więc nie potrzebuje pnpm install.
      - name: Zgodność wygenerowanej paczki z repo
        run: node scripts/build-wp-plugin-zip.mjs --check

  rls:
    # Macierz testów izolacji RLS (packages/db/test/rls-isolation.test.ts) —
    # najważniejsza bramka bezpieczeństwa Fazy 0. Osobny job: potrzebuje
    # działającego lokalnego Supabase (Postgres + Auth + PostgREST w
    # kontenerach), którego job `ci` nie uruchamia.
    # Pominięcie dla zmian wyłącznie dokumentacyjnych — patrz job `zakres`.
    needs: zakres
    if: ${{ !cancelled() && needs.zakres.outputs.pomin != 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      # Wersja CLI PRZYPIĘTA (nie `latest`): obrazy Dockera są dobierane per
      # wersja CLI — 2.109.1 to wersja używana lokalnie na mac-pm, więc jej
      # obrazy już są na dysku i start nic nie pobiera. Podbijaj ŚWIADOMIE:
      # pierwszy przebieg po podbiciu ściąga nowe obrazy (rzędu GB).
      - uses: supabase/setup-cli@v3
        with: { version: 2.109.1 }
      # KRYTYCZNE (self-hosted): na tym Macu działa WSPÓŁDZIELONY deweloperski
      # Supabase o TEJ SAMEJ konfiguracji (project_id "db", porty 543xx) —
      # identyfikator projektu pochodzi z config.toml, NIE z katalogu
      # roboczego. Bez łatki `supabase db reset` niżej zaorałby bazę
      # deweloperską. Łatka: project_id "db-ci", porty 563xx.
      - name: Izolacja efemerycznego Supabase od instancji współdzielonej
        run: bash .github/scripts/supabase-ci-izolacja.sh
      # Sonda pali job, ZANIM cokolwiek dotknie Dockera, jeśli config nadal
      # wskazuje instancję współdzieloną (mutacja „zdjęto łatkę" = czerwień).
      - name: Sonda izolacji portów
        run: bash .github/scripts/supabase-ci-sonda-izolacji.sh
      # `-x`: colima ma 4 GiB na WSZYSTKIE kontenery (stack współdzielony,
      # WordPressy dev i ten stack CI naraz) — stawiamy tylko to, czego suity
      # używają: db, kong, auth (niewyłączalny), rest, storage. Wykluczone
      # studio/meta/inbucket/realtime/edge-runtime/imgproxy/vector/analytics
      # nie są dotykane przez żadną suitę (realtime w testach to wyłącznie
      # transport WebSocket w konstruktorze klienta, bez subskrypcji).
      - run: supabase start -x studio,meta,inbucket,realtime,edge-runtime,functions,imgproxy,vector,analytics
        working-directory: packages/db
      - run: supabase db reset
        working-directory: packages/db
      - name: Eksport zmiennych lokalnego Supabase
        working-directory: packages/db
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_LOCAL_URL=$DB_URL"
            echo "SUPABASE_LOCAL_API_URL=$API_URL"
            echo "SUPABASE_LOCAL_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @avably/db test
      - run: pnpm --filter panel test
      # Storefront ma testy uruchomieniowe na żywym Supabase (m.in.
      # apps/storefront/test/api-v1-integration.test.ts — API v1 prawdziwymi
      # RPC kluczem anon). W jobie `ci` pomijają się same (brak zmiennych
      # SUPABASE_LOCAL_*), więc bez tego kroku dowody „naprawdę pisze/czyta
      # bazę" nie wykonywałyby się w CI nigdy.
      - run: pnpm --filter storefront test
      # Efemeryczny stack nie może przeżyć joba ani zostawić wolumenów
      # (własny sprzęt). Skrypt ma GUARD: nie tknie instancji współdzielonej,
      # nawet gdyby łatka izolacji nie doszła do skutku.
      - name: Sprzątanie efemerycznego Supabase
        if: always()
        run: bash .github/scripts/supabase-ci-sprzatanie.sh

  e2e:
    # Testy end-to-end ścieżki krytycznej (packages/e2e): przeglądarkowy
    # przebieg rezerwacja → checkout → płatność → panel na PRODUKCYJNYCH
    # buildach obu aplikacji (next build + next start), z lokalnym Supabase
    # jak w jobie `rls`. Noga płatności biegnie torem stubowanym — podpis
    # webhooka i werdykt z odczytu są prawdziwe, API dostawcy udaje lokalny
    # stub (granica zaufania: ADR-101). Sekrety dostawcy nie są potrzebne.
    # Porty aplikacji (4300-4302) są poza zakresami używanymi na mac-pm
    # (dev-serwery 3000+, Supabase 543xx/563xx, WordPressy 8090/8099).
    # Pominięcie dla zmian wyłącznie dokumentacyjnych — patrz job `zakres`.
    needs: zakres
    if: ${{ !cancelled() && needs.zakres.outputs.pomin != 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      # Wersja przypięta — uzasadnienie przy jobie `rls`.
      - uses: supabase/setup-cli@v3
        with: { version: 2.109.1 }
      # Izolacja od współdzielonego Supabase — uzasadnienie przy jobie `rls`.
      - name: Izolacja efemerycznego Supabase od instancji współdzielonej
        run: bash .github/scripts/supabase-ci-izolacja.sh
      - name: Sonda izolacji portów
        run: bash .github/scripts/supabase-ci-sonda-izolacji.sh
      - run: supabase start -x studio,meta,inbucket,realtime,edge-runtime,functions,imgproxy,vector,analytics
        working-directory: packages/db
      - run: supabase db reset
        working-directory: packages/db
      - name: Eksport zmiennych lokalnego Supabase
        working-directory: packages/db
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_LOCAL_URL=$DB_URL"
            echo "SUPABASE_LOCAL_API_URL=$API_URL"
            echo "SUPABASE_LOCAL_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # Bez `--with-deps` (to apt-get na Linuksie; macOS nie ma zależności
      # systemowych do doinstalowania) i bez `actions/cache`: przeglądarki
      # lądują w ~/Library/Caches/ms-playwright na dysku runnera i przeżywają
      # między przebiegami — krok jest no-opem, dopóki nie zmieni się wersja
      # Playwrighta. Higiena ręczna przy porządkach: stare wersje przeglądarek
      # usuwa `pnpm --filter @avably/e2e exec playwright uninstall --all`.
      - run: pnpm --filter @avably/e2e exec playwright install chromium
      # NEXT_PUBLIC_* to stałe build-time — build MUSI iść po eksporcie
      # zmiennych lokalnego Supabase, inaczej bundle wmuruje puste wartości.
      - name: Produkcyjny build obu aplikacji
        run: pnpm --filter @avably/e2e e2e:build
      - name: Testy e2e ścieżki krytycznej
        run: pnpm --filter @avably/e2e e2e
      # Trace/zrzuty/raport Playwrighta — bez nich porażka w CI jest nie do
      # zdiagnozowania (przebieg dzieje się w headless przeglądarce).
      - name: Artefakty diagnostyczne po porażce
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artefakty
          path: packages/e2e/.artefakty/
          retention-days: 7
          # Katalog artefaktów zaczyna się kropką, a upload-artifact domyślnie
          # POMIJA pliki ukryte (include-hidden-files: false od v4.4) — bez tej
          # flagi krok kończy się zielono z ostrzeżeniem „No files were found"
          # i nie wgrywa NICZEGO. Ukryta wada istniała już na v4; wyszła dopiero
          # przy wymuszonej porażce e2e (run 31492243755), bo krok stoi pod
          # if: failure() i zielone CI nigdy go nie wykonuje.
          include-hidden-files: true
      - name: Sprzątanie efemerycznego Supabase
        if: always()
        run: bash .github/scripts/supabase-ci-sprzatanie.sh
