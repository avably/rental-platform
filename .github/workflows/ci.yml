name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - run: bash scripts/audit-public-env.sh

  rls:
    # Macierz testów izolacji RLS (packages/db/test/rls-isolation.test.ts) —
    # najważniejsza bramka bezpieczeństwa Fazy 0. Osobny, równoległy job:
    # potrzebuje działającego lokalnego Supabase (Postgres + Auth + PostgREST
    # w kontenerach), którego job `ci` nie uruchamia.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
        working-directory: packages/db
      - run: supabase db reset
        working-directory: packages/db
      - name: Eksport zmiennych lokalnego Supabase
        working-directory: packages/db
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_LOCAL_URL=$DB_URL"
            echo "SUPABASE_LOCAL_API_URL=$API_URL"
            echo "SUPABASE_LOCAL_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_LOCAL_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @rental/db test
