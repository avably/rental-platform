packages:
  - "apps/*"
  - "packages/*"

# pnpm nie uruchamia skryptów instalacyjnych zależności, dopóki nie zostaną
# jawnie dopuszczone. Poniższa lista to pakiety kompilujące natywne binaria
# potrzebne do builda (Turbopack/SWC, bundler, przetwarzanie obrazów). Lista
# jest celowo minimalna — każdy wpis to zgoda na wykonanie kodu w trakcie
# instalacji, więc nowe pozycje dodajemy tylko po sprawdzeniu, po co są.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@5.0.9

patchedDependencies:
  # minimatch 3 oczekuje eksportu-funkcji z brace-expansion 1.x.
  # Adapter zachowuje jego API po bezpiecznym podniesieniu do 5.0.8.
  minimatch@3.1.5: patches/minimatch@3.1.5.patch

# Nadpisania wymuszone przez świeże doradztwa bezpieczeństwa (2026-07-22).
# Oba pakiety są ZALEŻNOŚCIAMI POŚREDNIMI — nie da się ich podnieść przez
# bump naszej zależności bezpośredniej, bo trzyma je next / react-email.
#   sharp    <0.35.0  — GHSA-f88m-g3jw-g9cj (CVE libvips; panel i sklep
#                       przetwarzają zdjęcia produktów, więc dotyczy nas)
#   fast-uri <3.1.4   — GHSA-v2hh-gcrm-f6hx (ajv w react-email)
#   next     <16.2.11 — GHSA-6gpp-xcg3-4w24 / GHSA-m99w-x7hq-7vfj /
#                       GHSA-4342-x723-8w8m i towarzyszące moderate
#                       (2026-07-23); zależność bezpośrednia podniesiona w
#                       apps/*, ten wpis domyka ścieżkę pośrednią
#                       @react-email/ui>next w packages/emails.
#   postcss  <8.5.12  — GHSA-6g55-p6wh-862q (odczyt pliku przez
#                       sourceMappingURL; 2026-07-23); pośredni przez
#                       next w obu appkach — bump bezpośredni nic nie da.
#   brace-expansion <5.0.9 — GHSA-rgw5-rvv9-x895 (DoS, obejście
#                       mitygacji CVE-2026-14257; 2026-08-03).
#                       Poprzednie nadpisanie na 5.0.8 przestało
#                       wystarczać — advisory obejmuje 5.0.8.
# Wpisy usuwamy, gdy next i react-email podniosą je same.
overrides:
  fast-uri: "^3.1.4"
  sharp: "^0.35.3"
  next: "^16.2.11"
  postcss: "^8.5.12"
  brace-expansion@<=5.0.8: ^5.0.9
